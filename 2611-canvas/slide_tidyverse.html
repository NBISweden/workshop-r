name: native_r_pipe
# Native R Pipe

From R 4.1.0 there is a native pipe `|&gt;`. It is simpler than `%&gt;%`:

* `x |&gt; f(y)` is rewritten to `f(x, y)` at parse time,
* the placeholder is `_` and it must be used with a **named** argument,
* no `.` placeholder, no `%T&gt;%`, no `%$%` (those come from `magrittr`),
* anonymous function: `x |&gt; (\(d) d[1:3, ])()`.


``` r
c(1:5) |&gt; mean()
mtcars |&gt; lm(mpg ~ hp, data = _) |&gt; coef()
```

```
## [1] 3
## (Intercept)          hp 
## 30.09886054 -0.06822828
```


``` r
c(1:5) %&gt;% mean()
mtcars %&gt;% lm(mpg ~ hp, data = .) %&gt;% coef()
```

```
## [1] 3
## (Intercept)          hp 
## 30.09886054 -0.06822828
```

&gt; In this course we use `%&gt;%`, because the lab needs `%T&gt;%` and `%$%`. In new code `|&gt;` is perfectly fine for the verbs below.

name: loading_data

# Loading Data

In `tidyverse` you import data using the `readr` package:

* `read_csv()` -- comma-delimited, `read_csv2()` -- semicolon-delimited,
* `read_tsv()` -- tab-delimited, `read_delim()` -- generic (any delimiter),
* `read_fwf()` -- fixed-width files.

--

Frequently used arguments:
* `skip` -- number of rows to skip,
* `col_names` -- a vector of column names (or `FALSE`),
* `col_types` -- force column types, e.g. `cols(id = col_character())`,
* `comment` -- character that designates a comment,
* `na` -- how missing values are represented.

`readr` tells you the column types it guessed. Check them!

Excel files: `readxl::read_excel()`.

---
name: readr_writing

# Writing to a File

The `readr` package also provides functions useful for writing tibbled data into a file:

* `write_csv()`
* `write_tsv()`
* `write_excel_csv()`

They **always** save:

* text in UTF-8,
* dates in ISO8601

But saving in csv (or tsv) does mean you lose information about the type of data in particular columns. You can avoid this by using:

* `write_rds()` and `read_rds()` to read/write objects in R binary rds format,
* `arrow::write_parquet()` and `arrow::read_parquet()` for a fast binary format that other programming languages can access.

# Grouping Notes

* `summarise()` drops the last grouping level (the message about `.groups`).
* Use `ungroup()` when you need to regroup within the same pipe.
* Since `dplyr` 1.1 you can group for a single operation with `.by`:


``` r
bijou %&gt;% summarise(mean_price = mean(price), .by = cut)
```

```
## # A tibble: 5 × 2

## 1 Ideal          3348.
## 2 Very Good      4045.
## 3 Fair           4294.
## 4 Premium        5586.
## 5 Good           5410.
```

# `across()` and `case_when()`

Apply the same function to many columns:


``` r
bijou %&gt;% summarise(across(c(carat, price), list(mean = mean, sd = sd)))
```

```
## # A tibble: 1 × 4

```

--

Create a variable from several conditions:


``` r
bijou %&gt;%
  mutate(size = case_when(carat &lt; 0.5 ~ "small",
                          carat &lt; 1   ~ "medium",
                          .default = "large")) %&gt;%
  count(size)
```

```
## # A tibble: 3 × 2
##   size       n
##   &lt;chr&gt;  &lt;int&gt;
## 1 large     76
## 2 medium    61
## 3 small     63

name: concept_of_tidy_data

# The Concept of Tidy Data

Data are tidy *sensu Wickham* if:
* each and every observation is represented as exactly one row,
* each and every variable is represented by exactly one column,
* thus each data table cell contains only one value.

Usually data are untidy in only one way. However, if you are unlucky, they are really untidy and thus a pain to work with...

name: joins2

# Mutating and Filtering Joins

* `inner_join()` -- rows with a match in both tables,
* `left_join()` / `right_join()` -- keep all rows of the left / right table (`NA` when no match),
* `full_join()` -- keep all rows of both,
* `anti_join()` -- rows of `x` with **no** match in `y`; `semi_join()` -- rows **with** a match.


``` r
left_join(tibble1, tibble2, by = 'key')
anti_join(tibble1, tibble2, by = 'key')
```

```
## # A tibble: 5 × 3
##     key value1 value2
##   &lt;dbl&gt; &lt;chr&gt;  &lt;chr&gt; 
## 1     1 a      A     
## 2     2 b      B     
## 3     3 c      C     
## 4     4 d      &lt;NA&gt;  
## 5     5 e      &lt;NA&gt;  
## # A tibble: 2 × 2
##     key value1
##   &lt;dbl&gt; &lt;chr&gt; 
## 1     4 d     
## 2     5 e
```

Different key names: `by = c("id" = "key")` or `by = join_by(id == key)`.
