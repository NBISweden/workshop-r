name: facet-wrap

# Facets • `facet_wrap`

* Split to subplots based on variable(s)
* Facetting in one dimension

--

.pull-left-50[

``` r
p &lt;- ggplot(iris)+
      geom_point(aes(x=Sepal.Length,
                     y=Sepal.Width,
                     color=Species))
p
```

]

.pull-right-50[

``` r

```

`facet_wrap` is used to split a plot into subplots based on the categories in one or more variables.

name: coordinate

# Coordinate Systems

| **Function**        | **What it does**                                    | **Common use / Example**                                  |
| ------------------- | --------------------------------------------------- | --------------------------------------------------------- |
| `coord_cartesian()` | Adjusts the visible region without removing data    | `coord_cartesian(xlim = c(2, 8))` → zoom into x-range 2–8 |
| `coord_fixed()`     | Keeps equal aspect ratio for x and y                | Useful for maps or shapes where scale should be equal     |
| `coord_flip()`      | Swaps x and y axes                                  | Great for horizontal bar plots                            |
| `coord_trans()`     | Transforms axes (e.g., log, sqrt)                   | `coord_trans(y = "log10")`                                |
| `coord_polar()`     | Converts to polar coordinates                       | Create pie charts or circular plots                       |
| `coord_map()`       | Uses map projection (scales adjusted for geography) | Plot geographic data with correct proportions             |

name: coordinate-polar

# Coordinate Systems • Polar
.pull-left-50[

``` r
p &lt;- ggplot(iris,aes(x="",y=Petal.Length,fill=Species))+
  geom_bar(stat="identity") 
p
```

&lt;img src="slide_ggplot2_part2_files/figure-html/unnamed-chunk-8-1.png" width="288" style="display: block; margin: auto auto auto 0;" /&gt;

]

--

.pull-right-50[

``` r
p+coord_polar("y",start=0)
```

&lt;img src="slide_ggplot2_part2_files/figure-html/unnamed-chunk-9-1.png" width="316.8" style="display: block; margin: auto auto auto 0;" /&gt;
]

???

The coordinate system defines the surface used to represent numbers. Most plots use the cartesian coordinate sytem. Pie charts for example, is a polar coordinate projection of a cartesian barplot. Maps for example can have numerous coordinate systems called map projections. For example; UTM coordinates.
 
&lt;div font-size = '80%'&gt; 

| **Stat name** | **Used with**                     | **What it does**                         |
| ------------- | --------------------------------- | ---------------------------------------- |
| `"count"`     | `geom_bar()`                      | Counts rows per x value                  |
| `"identity"`  | any geom                          | Plots given y-values directly            |
| `"summary"`   | `geom_bar()`, `geom_pointrange()` | Computes summaries like mean, median     |
| `"bin"`       | `geom_histogram()`                | Groups numeric data into bins            |
| `"density"`   | `geom_density()`                  | Computes kernel density estimate         |
| `"smooth"`    | `geom_smooth()`                   | Fits a smoothing line (e.g., regression) |

name: theme

# Theme

* Modify non-data plot elements/appearance
* Axis labels, panel colors, legend appearance etc
* Save a particular appearance for reuse
* `?theme`
* Two build-in themes: `theme_grey()`, `theme_bw()`  

--

.pull-left-50[

``` r
ggplot(iris,aes(Petal.Length))+
  geom_histogram()+
  facet_wrap(~Species,nrow=2)+
  theme_grey()
```

&lt;img src="slide_ggplot2_part2_files/figure-html/unnamed-chunk-10-1.png" width="288" style="display: block; margin: auto auto auto 0;" /&gt;
]

--

.pull-right-50[

``` r
ggplot(iris,aes(Petal.Length))+
  geom_histogram()+
  facet_wrap(~Species,nrow=2)+
  theme_bw()
```

&lt;img src="slide_ggplot2_part2_files/figure-html/unnamed-chunk-11-1.png" width="288" style="display: block; margin: auto auto auto 0;" /&gt;
]

???

Themes allow to modify all non-data related components of the plot. This is the visual appearance of the plot. Examples include the axes line thickness, the background color or font family.

name: theme-title

# Theme • Title
Default location of title is left aligned. But you can centre it or right align it by `theme`. 
`hjust`, horizontal justification, value ranges from 0 (left) to 1 (right). 

``` r
p &lt;- ggplot(iris)+
      geom_point(aes(x=Sepal.Length, y=Sepal.Width, color=Species))+
      labs(title="My Title",subtitle="My Subtitle")
p + theme(plot.title=element_text(hjust=0.5),
          plot.subtitle=element_text(hjust=1.0))
```

```
##         Murder Assault UrbanPop Rape
## Alabama   13.2     236       58 21.2
## Alaska    10.0     263       48 44.5
## Arizona    8.1     294       80 31.0

``` r

| **Position**          | **Description**                            | **Typical Use**                                       |
| --------------------- | ------------------------------------------ | ----------------------------------------------------- |
| `"stack"` *(default)* | Stacks bars on top of each other           | Show totals and part-to-whole relationships           |
| `"dodge"`             | Places bars side-by-side                   | Compare groups within the same category               |
| `"fill"`              | Stacks bars to equal height (100%)         | Show proportions within each category                 |

name: save
# Saving plots


``` r
p &lt;- ggplot(iris,aes(Petal.Length,Sepal.Length,color=Species))+
  geom_point()
```

* `ggplot2` plots can be saved just like base plots  


``` r
png("plot.png",height=5,width=7,units="cm",res=200)
print(p)
dev.off()
```

* `ggplot2` package offers a convenient function  


``` r
ggsave("plot.png",p,height=5,width=7,units="cm",dpi=200,type="cairo")
```

* Use `type="cairo"` for nicer anti-aliasing  
* Note that default units in `png` is pixels while in `ggsave` it's inches

# Extensions

* [**gridExtra**](https://cran.r-project.org/web/packages/gridExtra/index.html): Extends grid graphics functionality
* [**ggpubr**](http://www.sthda.com/english/rpkgs/ggpubr/): Useful functions to prepare plots for publication

* [**ggthemes**](https://cran.r-project.org/web/packages/ggthemes/vignettes/ggthemes.html): Set of extra themes  
* [**ggthemr**](https://github.com/cttobin/ggthemr): More themes  
* [**ggsci**](https://cran.r-project.org/web/packages/ggsci/vignettes/ggsci.html): Color palettes for scales  
* [**ggrepel**](https://cran.r-project.org/web/packages/ggrepel/vignettes/ggrepel.html): Advanced text labels including overlap control  
* [**ggmap**](https://github.com/dkahle/ggmap): Dedicated to mapping  
* [**ggraph**](https://github.com/thomasp85/ggraph): Network graphs  
* [**ggiraph**](http://davidgohel.github.io/ggiraph/): Converting ggplot2 to interactive graphics
