---
name: matrices

# 🧊 Matrices

Rows × columns, **one type**. A count table:


```
##        WT1  WT2  KO1  KO2
## BRCA1  120  135   40   52
## TP53   300  280  310  295
## MYC     15   22  180  165
## GAPDH 2100 1950 2240 2010
## [1] 4 4
```

---
name: matrices_indexing

# Matrices: indexing

`[row, column]`. Leave one empty to get everything.


```
## [1] 180
## WT1 WT2 KO1 KO2 
##  15  22 180 165 
##        KO1  KO2
## BRCA1   40   52
## TP53   310  295
## MYC    180  165
## GAPDH 2240 2010
```

--

Conditions work too:


```
##        WT1  WT2  KO1  KO2
## TP53   300  280  310  295
## MYC     15   22  180  165
## GAPDH 2100 1950 2240 2010
```

---
name: matrices_calc

# Matrices: calculating

Operations work on every element:


```
##             WT1       WT2       KO1       KO2
## BRCA1  6.918863  7.087463  5.357552  5.727920
## TP53   8.233620  8.134426  8.280771  8.209453
## MYC    4.000000  4.523562  7.499846  7.375039
## GAPDH 11.036860 10.929998 11.129927 10.973697
```

--

Sums and means per row or column:


```
##  WT1  WT2  KO1  KO2 
## 2535 2387 2770 2522 
##   BRCA1    TP53     MYC   GAPDH 
##   86.75  296.25   95.50 2075.00 
## BRCA1  TP53   MYC GAPDH 
##   135   310   180  2240
```

name: data_frames_1

# 📋 Data frames

- A **table**: like a spreadsheet.
- Each column is a vector, with **its own type**.
- All columns have the **same length**.

name: data_frames_create

# Data frames: creating

A sample sheet. **Name your columns!**


```
##   sample strain sex weight treated
## 1    WT1     WT   F   22.1   FALSE
## 2    WT2     WT   M   25.4    TRUE
## 3    KO1     KO   F   21.8   FALSE
## 4    KO2     KO   M   26.3    TRUE
```

---
name: data_frames_inspect

# Data frames: a first look


```
## 'data.frame':	4 obs. of  5 variables:
##  $ sample : chr  "WT1" "WT2" "KO1" "KO2"
##  $ strain : chr  "WT" "WT" "KO" "KO"
##  $ sex    : chr  "F" "M" "F" "M"
##  $ weight : num  22.1 25.4 21.8 26.3

```

##                                                           Mean   :23.90

##   treated       
##  Mode :logical  
##  FALSE:2        
##  TRUE :2        
##                 
##                 
## 
```

---
name: data_frames_accessing

# Data frames: accessing

`$` gets a column (a vector):


```
## [1] 22.1 25.4 21.8 26.3
## [1] 23.9
```

--

`[row, column]` works like a matrix:


```
##   sample strain sex weight treated
## 2    WT2     WT   M   25.4    TRUE
##   sample weight
## 1    WT1   22.1
## 2    WT2   25.4
## 3    KO1   21.8
## 4    KO2   26.3
## [1] 21.8
```

---
name: data_frames_filter

# Data frames: filtering rows

A condition picks the rows:


```
##   sample strain sex weight treated
## 3    KO1     KO   F   21.8   FALSE
## 4    KO2     KO   M   26.3    TRUE
##   sample strain sex weight treated
## 4    KO2     KO   M   26.3    TRUE
## [1] "WT2" "KO2"
```

This is your Excel filter. In one line, and it's saved in your script.

---
name: data_frames_add

# Data frames: adding columns


```
##   sample strain sex weight treated heavy
## 1    WT1     WT   F   22.1   FALSE FALSE
## 2    WT2     WT   M   25.4    TRUE  TRUE
## 3    KO1     KO   F   21.8   FALSE FALSE
## 4    KO2     KO   M   26.3    TRUE  TRUE
```

--

Calculations on columns work on all rows at once, just like vectors.

---
name: data_frames_merging

# Data frames: merging

Another table, **in a different order**:



--

`merge()` matches rows by a **key** column, not by position:


```
##   sample strain batch
## 1    KO1     KO     1
## 2    KO2     KO     2
## 3    WT1     WT     1
## 4    WT2     WT     2
```

.content-box-yellow[
Never paste tables side by side and hope the rows line up. Merge by ID.
]

name: data_frames_missing

```

##       0       0       0       1       0       0 
##   sample strain sex weight treated heavy
## 1    WT1     WT   F   22.1   FALSE FALSE
## 3    KO1     KO   F   21.8   FALSE FALSE
## 4    KO2     KO   M   26.3    TRUE  TRUE
```

name: lists_1

# 🎒 Lists

A list holds **anything**: vectors, tables, other lists.


```
## List of 4
##  $ name   : chr "MYC knockout pilot"
##  $ date   : chr "2026-03-14"
##  $ samples:'data.frame':	4 obs. of  6 variables:
##  $ counts : num [1:4, 1:4] 120 300 15 2100 135 280 22 1950 40 310 ...
##   ..- attr(*, "dimnames")=List of 2
```

---
name: lists_subsetting

# Lists: `[[ ]]` vs `[ ]`

.pull-left-50[

```
## [1] "MYC knockout pilot"
## [1] "character"
```

`[[ ]]` takes the thing **out**.
]

.pull-right-50[

```
## $name
## [1] "MYC knockout pilot"
## 
## [1] "list"
```

`[ ]` gives a **smaller list**.
]

---
name: lists_dollar

# Lists: `$` and digging deeper

`$` works like `[[ ]]` for named elements:


```
## [1] "MYC knockout pilot"
## [1] "WT1" "WT2" "KO1" "KO2"
## WT1 WT2 KO1 KO2 
##  15  22 180 165
```

--

Add or remove elements:


```
## [1] "name"    "samples" "counts"  "notes"
```

---
name: lists_results

# Lists are everywhere

Many functions return a list. A t-test, for example:


```
## [1] TRUE
##  [1] "statistic"   "parameter"   "p.value"     "conf.int"    "estimate"   
##  [6] "null.value"  "stderr"      "alternative" "method"      "data.name"  
## [1] 0.2956134
```

Knowing lists = knowing how to get your results out.

---
name: recap

# Recap

| | Shape | Types | Get things out |
|:--|:------|:------|:---------------|
| 🧊 **matrix** | rows × columns | one | `m["MYC", ]`, `m[, 2]` |
| 📋 **data frame** | rows × columns | one per column | `df$weight`, `df[df$x &gt; 1, ]` |
| 🎒 **list** | anything | anything | `l$samples`, `l[["name"]]` |

&lt;br&gt;

**Remember:**

- Filter rows with conditions, not by hand.
- Merge tables by ID, not by position.
- `[[ ]]` takes out, `[ ]` keeps a list.
