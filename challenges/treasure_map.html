#tm { --navy: #12355B; --sea: #2E6A9E; --cream: #FFF8EC; --gold: #F6C453; --red: #B23A2E; --prompt: #C2410C;
  margin: 1.5em 0 2em; color: var(--navy); }
#tm svg { display: block; width: 100%; height: auto; border-radius: 28px; }
#tm .tm-fog { transition: opacity 0.9s ease; }
#tm .tm-fog.tm-lifted { opacity: 0; pointer-events: none; }
#tm .tm-draw { stroke-dashoffset: 1; transition: stroke-dashoffset 1.4s ease-in-out; }
#tm .tm-draw.tm-on { stroke-dashoffset: 0; }
#tm-m5 .tm-draw { transition-delay: 1.2s; }
#tm .tm-fog[data-step="5"] { transition-delay: 2.2s; }
#tm .tm-lid { transform-box: fill-box; transform-origin: 0% 100%; transition: transform 0.8s 3s ease; }
#tm.tm-done .tm-lid { transform: translate(-4px, -10px) rotate(-22deg); }
#tm .tm-gold { opacity: 0; transition: opacity 0.6s 3.4s ease; }
#tm.tm-done .tm-gold { opacity: 1; }
#tm .tm-after, #tm.tm-done .tm-before { display: none; }
#tm.tm-done .tm-after { display: inline; }
#tm .tm-status { margin: 0.8em 0 0; font-family: 'JetBrains Mono', 'Courier New', monospace; font-weight: 700; font-size: 18px; text-align: center; }
#tm .tm-status span { color: var(--prompt); }
#tm .tm-prize { display: none; margin: 1em auto 0; max-width: 560px; padding: 0.5em 1.4em 0.9em; background: #FFFFFF;
  border: 4px solid var(--navy); border-radius: 18px; text-align: center; }
#tm.tm-done .tm-prize { display: block; }

#tm .tm-prize p { margin: 0; font-size: 16px; }
#tm .tm-play { margin-top: 0.8em; padding: 6px 18px; width: auto; height: auto; cursor: pointer;

#tm .tm-play:hover, #tm .tm-play:focus { background: var(--navy); }
#tm .tm-reset { display: block; margin: 0.6em auto 0; background: none; border: none; width: auto; height: auto;
  font: 13px 'JetBrains Mono', 'Courier New', monospace; color: #6B7C8F; text-decoration: underline; cursor: pointer; }
@media (prefers-reduced-motion: reduce) {
  #tm .tm-fog, #tm .tm-draw, #tm .tm-lid, #tm .tm-gold { transition: none; }
}

<script>
(function () {
  // which steps (fog + route) each challenge reveals; Thursday also reveals Treasure Island
  var steps = { colonies: [1], mice: [2], primers: [3], imposter: [4, 5] };
  var order = ["colonies", "mice", "primers", "imposter"];
  var key = "r-course-treasure-map";
  var root = document.getElementById("tm");
  function load() {
    try { return JSON.parse(localStorage.getItem(key)) || []; } catch (e) { return []; }
  }
  function save(list) {
    try { localStorage.setItem(key, JSON.stringify(list)); } catch (e) {}
  }
  var solved = load();

  // ---- Sound: "What shall we do with the drunken sailor" (traditional sea shanty,
  // public domain), played on a synthesised accordion, then a jingle of coins.
  // Made with the Web Audio API: no audio files needed.
  var audio = null;
  function getAudio() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!audio) audio = new AC();
    if (audio.state === "suspended") audio.resume();
    return audio;
  }
  function hz(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }
  function note(ctx, midi, start, dur, vol, type) {
    var out = ctx.createGain();
    out.gain.setValueAtTime(0, start);
    out.gain.linearRampToValueAtTime(vol, start + 0.02);
    out.gain.setValueAtTime(vol, start + dur * 0.75);
    out.gain.linearRampToValueAtTime(0, start + dur * 0.98);
    var filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 1800;
    filter.connect(out);
    out.connect(ctx.destination);
    [-6, 6].forEach(function (cents) {           // two detuned reeds = accordion
      var osc = ctx.createOscillator();
      osc.type = type || "sawtooth";
      osc.frequency.value = hz(midi);
      osc.detune.value = cents;
      osc.connect(filter);
      osc.start(start);
      osc.stop(start + dur);
    });
  }
  function playShanty() {
    var ctx = getAudio();
    if (!ctx) return;
    var A = 69, B = 71, C = 72, D = 62, E = 64, F = 65, G = 67, Dh = 74;
    var q = 0.26, e = q / 2;                     // quarter and eighth note (seconds)
    var tune = [
      [A, q], [A, e], [A, e], [A, q], [A, e], [A, e], [A, q], [D, q], [F, q], [A, q],
      [G, q], [G, e], [G, e], [G, q], [G, e], [G, e], [G, q], [C - 12, q], [E, q], [G, q],
      [A, q], [A, e], [A, e], [A, q], [A, e], [A, e], [A, q], [B, q], [C, q], [Dh, q],
      [C, q], [A, q], [G, q], [E, q], [D, q * 2], [D, q * 2]
    ];
    var bass = [50, 50, 48, 48, 50, 50, 48, 50];   // one bass note per bar
    var t = ctx.currentTime + 0.05;
    tune.forEach(function (n) { note(ctx, n[0], t, n[1], 0.09); t += n[1]; });
    var b0 = ctx.currentTime + 0.05;
    bass.forEach(function (m, i) { note(ctx, m, b0 + i * q * 4, q * 3.6, 0.05, "triangle"); });
    [86, 90, 93, 98, 93, 98].forEach(function (m, i) {   // coins
      note(ctx, m, t + 0.05 + i * 0.07, 0.25, 0.05, "triangle");
    });
  }
  function render() {
    order.forEach(function (id) {
      var on = solved.indexOf(id) >= 0;
      steps[id].forEach(function (step) {
        root.querySelector('.tm-fog[data-step="' + step + '"]').classList.toggle("tm-lifted", on);
        root.querySelector("#tm-m" + step + " .tm-draw").classList.toggle("tm-on", on);
      });
    });
    var n = order.filter(function (id) { return solved.indexOf(id) >= 0; }).length;
    document.getElementById("tm-count").textContent = "[1] " + n + " of 4";
    root.classList.toggle("tm-done", n === order.length);
  }
  window.treasureMap = {
    solve: function (id) {
      if (order.indexOf(id) < 0 || solved.indexOf(id) >= 0) return;
      solved.push(id);
      save(solved);
      render();
      if (solved.length === order.length) {
        getAudio();                          // unlock audio while we still have the click
        setTimeout(playShanty, 3000);        // play when the chest opens
      }
    },
    solved: function () { return solved.slice(); }
  };
  document.getElementById("tm-play").addEventListener("click", playShanty);
  document.getElementById("tm-reset").addEventListener("click", function () {
    solved = [];
    save(solved);
    render();
    document.querySelectorAll(".walkthrough.unlocked").forEach(function (w) { w.classList.remove("unlocked"); w.open = false; });
    document.querySelectorAll(".challenge-feedback").forEach(function (f) { f.textContent = ""; });
  });
  render();
})();
</script>
